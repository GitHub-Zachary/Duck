<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#16633e">
    <meta name="description" content="禽类计算器，输入处理后重量和每斤单价，即可计算鸡、鸭、鹅的应收金额。">
    <title>禽类计算器</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172c23; background: #f3f5ef; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px 16px max(24px, env(safe-area-inset-bottom)); }
        main { max-width: 480px; margin: 0 auto; }
        header { margin-bottom: 16px; }
        h1 { font-size: 30px; line-height: 1.3; margin: 0 0 6px; letter-spacing: 1px; }
        form { padding: 22px 20px; background: #fff; border: 1px solid #dce3da; border-radius: 20px; }
        .input-group { position: relative; scroll-margin-block: 16px; }
        .input-group + .input-group { margin-top: 22px; }
        label { position: absolute; z-index: 1; top: 12px; left: 16px; right: 16px; display: block; font-size: 23px; font-weight: 700; line-height: 1.4; cursor: text; }
        .step { display: inline-grid; place-items: center; width: 28px; height: 28px; font-size: 18px; margin-right: 8px; border-radius: 50%; background: #eaf2e9; color: #285639; vertical-align: 2px; }
        .input-wrap { position: relative; }
        input { display: block; width: 100%; min-width: 0; height: 124px; border: 2px solid #819589; border-radius: 12px; background: #fff; color: #172c23; padding: 49px 84px 10px 16px; font: 700 40px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-variant-numeric: tabular-nums; }
        input::placeholder { color: #65766b; font-size: 24px; font-weight: 400; opacity: 1; }
        input:focus { outline: 3px solid #b6d8b9; outline-offset: 2px; border-color: #16633e; }
        input[aria-invalid="true"] { border-color: #ac3029; }
        .unit { position: absolute; right: 16px; top: calc(50% + 20px); transform: translateY(-50%); color: #445e4f; font-size: 20px; pointer-events: none; }
        button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
        button:focus-visible, summary:focus-visible { outline: 3px solid #16633e; outline-offset: 4px; }
        .calculate { display: block; width: 100%; min-height: 72px; margin-top: 24px; padding: 14px; border: 0; border-radius: 12px; background: #16633e; color: #fff; font-size: 28px; font-weight: 700; }
        .calculate:active { background: #104b2f; }
        .error { margin: 16px 0 0; color: #a02622; font-size: 20px; line-height: 1.5; font-weight: 600; }
        [hidden] { display: none !important; }
        .result { margin-top: 20px; padding: 24px 20px; border: 2px solid #16633e; border-radius: 20px; background: #edf5e9; overflow-wrap: anywhere; }
        .result h2 { font-size: 23px; margin: 0 0 6px; }
        .amount { color: #104b2f; font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; margin: 0 0 14px; }
        .amount small { font-size: 23px; font-weight: 600; margin-left: 6px; }
        .weight-block { border-top: 1px solid #b8cbb5; padding-top: 16px; margin-bottom: 12px; }
        .weight-block h3 { font-size: 23px; margin: 0 0 6px; }
        .weight-value { font-size: 48px; margin-bottom: 0; }
        .receipt { color: #334d3c; font-size: 19px; line-height: 1.6; margin: 0; }
        .next { width: 100%; min-height: 62px; margin-top: 20px; padding: 12px; border: 2px solid #16633e; border-radius: 12px; background: #fff; color: #104b2f; font-size: 23px; font-weight: 700; }
        .next-note { color: #526359; text-align: center; font-size: 17px; margin: 8px 0 0; }
        details { margin-top: 22px; color: #445b4c; font-size: 18px; line-height: 1.6; }
        summary { min-height: 48px; padding: 10px 0; cursor: pointer; font-size: 19px; }
        details p { margin: 8px 0; }
        .detail-row { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0; }
        @media (max-width: 360px) {
            body { padding: 16px 12px 24px; }
            form, .result { padding: 20px 16px; }
            h1 { font-size: 28px; }
            input { font-size: 36px; padding-left: 12px; }
            input::placeholder { font-size: 22px; }
            .amount { font-size: 48px; }
            .weight-value { font-size: 44px; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>禽类计算器</h1>
    </header>
    <form id="calculator" novalidate>
        <div class="input-group">
            <label for="processedWeight"><span class="step" aria-hidden="true">1</span>处理后有几斤</label>
            <div class="input-wrap">
                <input type="text" inputmode="decimal" id="processedWeight" placeholder="请输入斤数" autocomplete="off" enterkeyhint="next" aria-describedby="inputError" spellcheck="false">
                <span class="unit">斤</span>
            </div>
        </div>
        <div class="input-group">
            <label for="sellingPrice"><span class="step" aria-hidden="true">2</span>每斤卖多少钱</label>
            <div class="input-wrap">
                <input type="text" inputmode="decimal" id="sellingPrice" placeholder="请输入单价" autocomplete="off" enterkeyhint="done" aria-describedby="inputError" spellcheck="false">
                <span class="unit">元/斤</span>
            </div>
        </div>
        <p id="inputError" class="error" role="alert" hidden></p>
        <button class="calculate" type="submit">计算收多少钱</button>
    </form>
    <section id="result" class="result" aria-labelledby="resultHeading" aria-live="polite" hidden>
        <h2 id="resultHeading">这只应收</h2>
        <p class="amount"><span id="resultTotalSelling"></span><small>元</small></p>
        <div class="weight-block">
            <h3>原始重量</h3>
            <p class="amount weight-value"><span id="resultOriginalWeight"></span><small>斤</small></p>
        </div>
        <p class="receipt">每斤 <strong id="resultSellingPrice"></strong> 元</p>
        <p class="receipt">已包含 23 元杂项费用</p>
        <button type="button" id="nextCalculation" class="next">算下一只</button>
        <p class="next-note">保留单价，重新输入斤数</p>
        <details id="calculationDetails">
            <summary>查看详细计算</summary>
            <div class="detail-row"><span>处理后重量</span><strong><span id="resultProcessedWeight"></span> 斤</strong></div>
            <p>原始重量 = 处理后重量 ÷ 0.71</p>
            <p>应收金额 = 原始重量 × 每斤单价 + 23 元</p>
            <p>按未四舍五入的原始重量计算，结果保留两位小数。</p>
        </details>
    </section>
    <noscript><p class="error">请开启浏览器的 JavaScript，才能使用计算器。</p></noscript>
</main>
<script>
    const form = document.getElementById('calculator');
    const weightInput = document.getElementById('processedWeight');
    const priceInput = document.getElementById('sellingPrice');
    const result = document.getElementById('result');
    const error = document.getElementById('inputError');

    // 微信 iOS 键盘可能只把输入框移到可见区，遮住它上方的标签。
    // 按键盘弹出后的实际可见区域定位，让整组标签和输入框一起露出。
    let inputViewportFrame = 0;
    function keepFocusedInputVisible() {
        inputViewportFrame = 0;
        const input = document.activeElement;
        if (input !== weightInput && input !== priceInput) return;
        const viewport = window.visualViewport;
        const visibleTop = viewport ? viewport.offsetTop : 0;
        const visibleHeight = viewport ? viewport.height : window.innerHeight;
        const bounds = input.closest('.input-group').getBoundingClientRect();
        const topLimit = visibleTop + 16;
        const bottomLimit = visibleTop + visibleHeight - 16;
        let distance = 0;
        if (bounds.top < topLimit) {
            distance = bounds.top - topLimit;
        } else if (bounds.bottom > bottomLimit) {
            distance = Math.min(bounds.top - topLimit, bounds.bottom - bottomLimit);
        }
        if (Math.abs(distance) > 1) window.scrollBy(0, distance);
    }
    function scheduleInputVisibility() {
        if (!inputViewportFrame) inputViewportFrame = window.requestAnimationFrame(keepFocusedInputVisible);
    }
    [weightInput, priceInput].forEach(function (input) {
        input.addEventListener('focus', function () {
            scheduleInputVisibility();
            // 兼容键盘动画结束后才执行的浏览器自动滚动。
            window.setTimeout(scheduleInputVisibility, 350);
        });
    });
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleInputVisibility);
        window.visualViewport.addEventListener('scroll', scheduleInputVisibility);
    }

    function clearResult() {
        result.hidden = true;
        document.getElementById('calculationDetails').open = false;
        error.hidden = true;
        weightInput.removeAttribute('aria-invalid');
        priceInput.removeAttribute('aria-invalid');
    }

    function readPositiveNumber(input, message) {
        const text = input.value.trim();
        const value = Number(text);
        if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(text) || !Number.isFinite(value) || value <= 0) {
            error.textContent = message;
            error.hidden = false;
            input.setAttribute('aria-invalid', 'true');
            input.focus();
            return null;
        }
        return value;
    }

    function calculate() {
        clearResult();
        const processedWeight = readPositiveNumber(weightInput, '请先输入正确的斤数，例如 3.5');
        if (processedWeight === null) return;
        const sellingPrice = readPositiveNumber(priceInput, '请先输入正确的单价，例如 18');
        if (sellingPrice === null) return;
        const miscFee = 23; // 保持原项目的固定杂项费用。
        // 保持原公式及计算顺序，中途不四舍五入。
        const originalWeight = processedWeight / 0.71;
        const totalSelling = originalWeight * sellingPrice + miscFee;
        if (!Number.isFinite(originalWeight) || !Number.isFinite(totalSelling)) {
            error.textContent = '数字太大，请检查斤数和单价后再算。';
            error.hidden = false;
            return;
        }
        document.getElementById('resultProcessedWeight').textContent = processedWeight.toFixed(2);
        document.getElementById('resultSellingPrice').textContent = sellingPrice.toFixed(2);
        document.getElementById('resultOriginalWeight').textContent = originalWeight.toFixed(2);
        document.getElementById('resultTotalSelling').textContent = totalSelling.toFixed(2);
        result.hidden = false;
        if (document.activeElement === weightInput || document.activeElement === priceInput) document.activeElement.blur();
        result.scrollIntoView({ block: 'nearest' });
    }

    form.addEventListener('submit', function (event) { event.preventDefault(); calculate(); });
    weightInput.addEventListener('input', clearResult);
    priceInput.addEventListener('input', clearResult);
    weightInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); priceInput.focus(); }
    });
    document.getElementById('nextCalculation').addEventListener('click', function () {
        clearResult();
        weightInput.value = '';
        weightInput.focus();
    });
</script>
</body>
</html>
